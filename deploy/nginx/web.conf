# CSE Archive API gateway — reached only from the reverse proxy container
# over the shared docker network; nothing is published to host ports.
#
#   api.csearchive.ir  →  Django API proxy + /media/ served off disk

server {
    listen 8082;
    server_name api.csearchive.ir;

    # Admin uploads (reference PDFs, professor images, …).
    client_max_body_size 200m;

    # Uploaded files — nginx serves these directly from the shared volume.
    # CORS header mirrors the old production nginx: the SPA on csearchive.ir
    # fetches these cross-origin (PDF viewer, images).
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the scheme Caddy saw (https), don't overwrite with $scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_read_timeout 120s;
    }
}
