# CSE Archive (csearchive.ir) — stack at /opt/csearchive. Two repo images:
# csearchive-frontend (nginx, SPA) and csearchive-web (gateway: api + media),
# both joined to this compose network. TLS is issued automatically once the
# DNS A records point at this server.
# ---------------------------------------------------------------------------
csearchive.ir {
	encode zstd gzip

	reverse_proxy csearchive-frontend:80
}

www.csearchive.ir {
	redir https://csearchive.ir{uri}
}

api.csearchive.ir {
	encode zstd gzip

	# Admin uploads (reference PDFs, professor images, recordings metadata).
	request_body {
		max_size 200MB
	}

	reverse_proxy csearchive-web:8082
}

www.api.csearchive.ir {
	redir https://api.csearchive.ir{uri}
}
